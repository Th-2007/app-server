<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>FILEBOX SERVER</title>

<link rel="stylesheet" href="estilo.css">

</head>


<body>


<header>

<h1>📁 FILEBOX</h1>

<p>
Servidor personal de archivos
</p>

</header>



<section class="panel">


<div class="buttons">

<button onclick="openUpload()">
📤 Subir archivo
</button>


<button onclick="createFolder()">
📁 Nueva carpeta
</button>


<button onclick="loadFiles()">
🔄 Actualizar
</button>


</div>



<input
type="file"
id="fileInput"
hidden
onchange="uploadFile()"
>



<input
id="search"
placeholder="Buscar archivo..."
oninput="searchFiles()"
>




<div class="dropzone"
id="dropzone">

Arrastra archivos aquí

</div>



<div class="stats">


<div>
Archivos
<b id="count">
0
</b>
</div>


<div>
Espacio usado
<b id="used">
0
</b>
</div>


<div>
Servidor
<b id="status">
OFFLINE
</b>
</div>


</div>



</section>




<section class="files">


<h2>
Archivos
</h2>


<table>


<thead>

<tr>

<th>
Nombre
</th>


<th>
Tamaño
</th>


<th>
Fecha
</th>


<th>
Acciones
</th>


</tr>

</thead>



<tbody id="fileList">


<tr>

<td colspan="4">

Cargando...

</td>

</tr>


</tbody>


</table>


</section>





<div id="viewer"
class="viewer">


<img id="previewImage">


<video
id="previewVideo"
controls>
</video>


</div>





<script src="script.js"></script>


</body>

</html>
